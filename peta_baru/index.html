<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>Peta Spasial Pekalongan</title>
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="./resources/ol3-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css">
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: #0c0d14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* FLOATING LAYER SWITCHER PANEL */
        .layer-control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(18, 21, 37, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #2a2e4a;
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
        }
        .layer-control-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #9aa1bc;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .layer-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            outline: none;
        }
        .layer-toggle-btn.active-penduduk {
            background: #4ecca3;
            color: #0c0d14;
            box-shadow: 0 2px 10px rgba(78, 204, 163, 0.4);
        }
        .layer-toggle-btn.active-murid {
            background: #ff5c77;
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(255, 92, 119, 0.4);
        }
        .layer-toggle-btn.inactive {
            background: rgba(255, 255, 255, 0.05);
            color: #a0a8c4;
            border-color: rgba(255, 255, 255, 0.08);
        }
        .layer-toggle-btn.inactive:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* POPUP STYLING */
        .ol-popup {
            max-height: 280px;
            max-width: 300px;
            overflow-y: auto;
            font-size: 12px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            background: #181b2e;
            color: #f0f2fd;
            border: 1px solid #2a2e4a;
            padding: 14px;
        }
        .ol-popup-closer {
            color: #ff5c77;
            text-decoration: none;
            position: absolute;
            top: 6px;
            right: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        .ol-popup table {
            width: 100%;
            border-collapse: collapse;
        }
        .ol-popup th {
            text-align: left;
            padding: 5px 6px;
            color: #4ecca3;
            font-size: 11px;
            border-bottom: 1px solid #262a45;
        }
        .ol-popup td {
            padding: 5px 6px;
            color: #e2e8f0;
            border-bottom: 1px solid #262a45;
        }
    </style>
</head>
<body>
    <div id="map">
        <!-- Floating Layer Control -->
        <div class="layer-control-panel">
            <div class="layer-control-title">
                <span>Pilih Layer Tematik</span>
                <span id="active-indicator" style="color:#4ecca3;">● Aktif</span>
            </div>
            <button id="btn-penduduk" class="layer-toggle-btn active-penduduk" onclick="setLayer('penduduk')">
                👥 Kepadatan Penduduk
            </button>
            <button id="btn-murid" class="layer-toggle-btn inactive" onclick="setLayer('murid')">
                🎓 Jumlah Murid SLTP
            </button>
        </div>

        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer">✖</a>
            <div id="popup-content"></div>
        </div>
    </div>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="resources/proj4.js"></script>
    <script>proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');</script>
    <script src="resources/polyfills.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol-debug.js"></script>
    <script src="./resources/ol3-layerswitcher.js"></script>
    <script src="layers/Peta_Penduduk_1.js"></script>
    <script src="layers/Peta_Murid_2.js"></script>
    <script src="styles/Peta_Penduduk_1_style.js"></script>
    <script src="styles/Peta_Murid_2_style.js"></script>
    <script src="./layers/layers.js" type="text/javascript"></script> 
    <script src="./resources/qgis2web.js"></script>
    <script src="./resources/Autolinker.min.js"></script>

    <script>
    function setLayer(selected) {
        var btnP = document.getElementById('btn-penduduk');
        var btnM = document.getElementById('btn-murid');
        var ind = document.getElementById('active-indicator');

        if (selected === 'penduduk') {
            if (typeof lyr_Peta_Penduduk_1 !== 'undefined') lyr_Peta_Penduduk_1.setVisible(true);
            if (typeof lyr_Peta_Murid_2 !== 'undefined') lyr_Peta_Murid_2.setVisible(false);
            btnP.className = 'layer-toggle-btn active-penduduk';
            btnM.className = 'layer-toggle-btn inactive';
            ind.style.color = '#4ecca3';
        } else {
            if (typeof lyr_Peta_Penduduk_1 !== 'undefined') lyr_Peta_Penduduk_1.setVisible(false);
            if (typeof lyr_Peta_Murid_2 !== 'undefined') lyr_Peta_Murid_2.setVisible(true);
            btnP.className = 'layer-toggle-btn inactive';
            btnM.className = 'layer-toggle-btn active-murid';
            ind.style.color = '#ff5c77';
        }
    }

    // Pastikan saat map load, layer penduduk aktif dan murid mati
    window.addEventListener('load', function() {
        if (typeof lyr_Peta_Penduduk_1 !== 'undefined') lyr_Peta_Penduduk_1.setVisible(true);
        if (typeof lyr_Peta_Murid_2 !== 'undefined') lyr_Peta_Murid_2.setVisible(false);
    });
    </script>
</body>
</html>
